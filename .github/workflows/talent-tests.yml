name: Talent Regression Tests

on:
  push:
    paths:
      - 'scripts/talent_*.gd'
      - 'scripts/team_formation.gd'
      - 'scripts/progression_balance_v1.gd'
      - 'scripts/save_manager.gd'
      - 'scripts/battle_manager.gd'
      - 'tests/test_talent_menu_v2.py'
      - '.github/workflows/talent-tests.yml'
  pull_request:
    paths:
      - 'scripts/talent_*.gd'
      - 'scripts/team_formation.gd'
      - 'scripts/progression_balance_v1.gd'
      - 'scripts/save_manager.gd'
      - 'scripts/battle_manager.gd'
      - 'tests/test_talent_menu_v2.py'
      - '.github/workflows/talent-tests.yml'
  workflow_dispatch:

jobs:
  talent-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run talent source regression suite
        run: python -m unittest discover -s tests -p 'test_talent_menu_v2.py' -v
