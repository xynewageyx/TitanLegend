name: Android-style GLB equipment visual QA
on:
  pull_request:
    paths:
      - 'scripts/chibi_glb_visual.gd'
      - 'scripts/team_formation.gd'
      - 'scripts/hero_combat_motion.gd'
      - 'scripts/equipment/**'
      - 'scripts/weapons/procedural_weapon_preview.gd'
      - 'tests/test_weapon_armor_silhouette_v2.gd'
      - 'tools/render_live_equipment_qa.gd'
      - 'tools/check_four_hero_visual_manifest.py'
      - 'tests/test_check_four_hero_visual_manifest.py'
      - 'tests/test_death_knight_locomotion_polish.gd'
      - 'scripts/animation/death_knight_locomotion_polish.gd'
      - 'tests/test_chibi_weapon_animation_grip.gd'
      - '.github/workflows/animated-equipment-visual-qa.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/chibi_glb_visual.gd'
      - 'scripts/team_formation.gd'
      - 'scripts/hero_combat_motion.gd'
      - 'scripts/equipment/**'
      - 'scripts/weapons/procedural_weapon_preview.gd'
      - 'tests/test_weapon_armor_silhouette_v2.gd'
      - 'tools/render_live_equipment_qa.gd'
      - '.github/workflows/animated-equipment-visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  rendered-equipment:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: "llvmpipe"
      MESA_GL_VERSION_OVERRIDE: "3.3"
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2 and software OpenGL display
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libgl1 libglu1-mesa libx11-6
          curl --fail --location --retry 3 -o /tmp/godot.zip 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version | grep -F '4.7.2.stable'
      - name: Import original GLBs and scripts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf original_update168
          python3 tools/generate_audio_sfx.py
          timeout 180s godot --headless --path . --editor --import --quit 2>&1 | tee /tmp/equipment-visual-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script' /tmp/equipment-visual-import.log; then exit 1; fi
      - name: Validate all 72 weapon rarities and 156 armor profiles
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s godot --headless --path . --script res://tests/test_weapon_armor_silhouette_v2.gd 2>&1 | tee /tmp/titan-silhouette-v2.log
          grep -Fq 'TITAN_SILHOUETTE_V2_OK weapons=72 armors=156 faceted=36 rarities=6' /tmp/titan-silhouette-v2.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:' /tmp/titan-silhouette-v2.log; then exit 1; fi
      - name: Verify Death Knight Idle Walk polish with real OpenGL renderer
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s xvfb-run -a -s '-screen 0 720x1280x24' godot \
            --path . --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://tests/test_death_knight_locomotion_polish.gd \
            2>&1 | tee /tmp/death-knight-opengl-polish.log
          grep -Fq 'PASS: Death Knight private Idle Walk polish actions=2 added_tracks=6 original_glb_unchanged=true' /tmp/death-knight-opengl-polish.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:' /tmp/death-knight-opengl-polish.log; then exit 1; fi
      - name: Render original twelve-class equipment in Godot OpenGL
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s xvfb-run -a -s '-screen 0 720x1280x24' godot \
            --path . --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://tools/render_live_equipment_qa.gd \
            2>&1 | tee /tmp/equipment-visual-qa.log
          grep -Fq 'TITAN_EQUIPMENT_VISUAL_QA_OK images=71 classes=12' /tmp/equipment-visual-qa.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:' /tmp/equipment-visual-qa.log; then exit 1; fi
          test "$(find build/animated_equipment_qa -name '*.png' | wc -l)" -eq 75
          test -s build/animated_equipment_qa/manifest.json
          test -s build/animated_equipment_qa/death_knight_front_attack.png
          test -s build/animated_equipment_qa/warrior_side_attack.png
          test -s build/animated_equipment_qa/shaman_side_attack.png
          test -s build/animated_equipment_qa/mage_side_attack.png
          test -s build/animated_equipment_qa/overview_front_attack.png
          test -s build/animated_equipment_qa/overview_side_attack.png
          test -s build/animated_equipment_qa/overview_front_walk.png
          test -s build/animated_equipment_qa/overview_front_dodge.png
          test -s build/animated_equipment_qa/death_knight_front_dodge.png
          test -s build/animated_equipment_qa/formation_mythic_idle.png
          test -s build/animated_equipment_qa/formation_mythic_walk.png
          test -s build/animated_equipment_qa/formation_mythic_attack.png
          test -s build/animated_equipment_qa/formation_mythic_dodge.png
          test -s build/animated_equipment_qa/formation_mythic_attack_without_weapon.png
          test -s build/animated_equipment_qa/formation_mythic_attack_without_pet.png
          test -s build/animated_equipment_qa/formation_mythic_attack_without_effect.png
          grep -Fq "TITAN_FORMATION_PIXEL_DIFFERENTIAL" /tmp/equipment-visual-qa.log
          grep -Fq 'TITAN_FORMATION_VISUAL_QA_FRAME pose=Dodge weapons=4' /tmp/equipment-visual-qa.log
      - name: Audit four-hero camera, pet and attack-effect visibility
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_check_four_hero_visual_manifest.py' -v
          python3 tools/check_four_hero_visual_manifest.py build/animated_equipment_qa/manifest.json --output build/animated_equipment_qa/formation_visibility_audit.json
          test -s build/animated_equipment_qa/formation_visibility_audit.json
      - name: Upload screenshot collection for Android review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TitanLegends-Rarity-Silhouette-V2-Visual-QA
          path: |
            build/animated_equipment_qa/*.png
            build/animated_equipment_qa/manifest.json
            build/animated_equipment_qa/formation_visibility_audit.json
          if-no-files-found: warn
          retention-days: 30
