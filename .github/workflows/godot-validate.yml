name: Godot project validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify core project files
        shell: bash
        run: |
          set -euo pipefail
          for f in project.godot scenes/main.tscn scripts/team_formation.gd scripts/battle_manager.gd scripts/save_manager.gd scripts/ui_manager.gd scripts/biome_manager.gd; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Required Godot project file is missing"
              exit 1
            fi
          done
      - name: Install Godot 4.6
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.6-stable_linux.x86_64
          sudo mv /tmp/Godot_v4.6-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import assets and parse project
        shell: bash
        run: |
          godot --headless --path . --editor --import --quit
      - name: Test boss camera framing
        shell: bash
        run: |
          python3 -m unittest discover -s tests -p 'test_boss_camera_framing.py' -v
      - name: Test Android boss and equipment visuals
        shell: bash
        run: |
          python3 -m unittest discover -s tests -p 'test_boss_visuals_and_equipment_menu.py' -v
      - name: Test ten-element landscape and single terrain wiring
        shell: bash
        run: |
          python3 tests/test_biome_scene_wiring.py
      - name: Test automatic encounter walking visuals
        shell: bash
        run: |
          python3 -m unittest discover -s tests -p 'test_encounter_walk_visuals.py' -v
      - name: Check elemental transition visuals
        run: python3 -m unittest discover -s tests -p 'test_element_transition_visuals.py' -v
      - name: Check class-specific walking animations
        run: python3 -m unittest discover -s tests -p 'test_hero_gait_visuals.py' -v
      - name: Verify hero attack animations
        run: python3 tests/test_hero_attack_visuals.py
      - name: Check elemental boss hit reactions
        run: python3 tests/test_boss_hit_visuals.py
      - name: Check boss warning animations
        run: python3 tests/test_boss_warning_visuals.py
      - name: Check portrait exploration camera
        run: python3 tests/test_portrait_exploration_camera.py
      - name: Check fantasy costume and elemental pet models
        run: |
          python3 tests/test_fantasy_costumes.py
          python3 tests/test_pet_creature_visuals.py
      - name: Test all hero class and role visual models
        shell: bash
        run: |
          godot --headless --path . --script res://tests/test_hero_visual_upgrade.gd
      - name: Test fantasy adventure HUD and touch menus
        shell: bash
        run: |
          godot --headless --path . --script res://tests/test_adventure_hud.gd
      - name: Test automatic save integrity and backup recovery
        shell: bash
        run: |
          godot --headless --path . --script res://tests/test_save_integrity.gd
      - name: Test offline gold and no boss progression
        shell: bash
        run: |
          godot --headless --path . --script res://tests/test_offline_rewards.gd
      - name: Test in-app AFK farming and safe return to boss checkpoint
        shell: bash
        run: |
          godot --headless --path . --script res://tests/test_afk_farming.gd
      - name: Test tank interception damage and overkill edge cases
        shell: bash
        run: |
          godot --headless --path . --script res://tests/test_tank_interception_math.gd
      - name: Launch smoke test
        shell: bash
        run: |
          timeout 20s godot --headless --path . --quit-after 120

  android-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot 4.6 and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          version=4.6-stable
          base="https://github.com/godotengine/godot-builds/releases/download/$version"
          curl --fail --location --retry 3 -o /tmp/godot.zip "$base/Godot_v4.6-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.6-stable_linux.x86_64 /usr/local/bin/godot
          curl --fail --location --retry 3 -o /tmp/templates.tpz "$base/Godot_v4.6-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.6.stable/"
      - name: Configure Android SDK and persistent debug signing
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          mkdir -p "$HOME/.android"
          if [ -z "${{ secrets.TITAN_ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::Set TITAN_ANDROID_KEYSTORE_BASE64 repository secret to a persistent base64-encoded debug keystore. Do not generate a fresh key on each run."
            exit 1
          fi
          printf '%s' "${{ secrets.TITAN_ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Increment Android version code for installable updates
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          path = Path("export_presets.cfg")
          content = path.read_text()
          code = int(os.environ["BUILD_NUMBER"]) + 1
          updated, count = re.subn(r'(?m)^version/code=\d+$', f'version/code={code}', content, count=1)
          if count != 1:
              raise SystemExit("Expected exactly one Android version/code entry")
          path.write_text(updated)
          print(f"Android versionCode: {code}")
          PY
      - name: Validate Android debug APK export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --editor --import --quit
          godot --headless --path . --export-debug "Android" build/TitanLegends-debug.apk
          test -s build/TitanLegends-debug.apk
          unzip -tq build/TitanLegends-debug.apk
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TitanLegends-Android-debug
          path: build/TitanLegends-debug.apk
          if-no-files-found: error
          retention-days: 14
