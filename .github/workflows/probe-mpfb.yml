name: Probe MPFB character creator
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-mpfb.yml'
      - 'tools/asset_pipeline/probe_mpfb.py'
permissions:
  contents: read
jobs:
  mpfb-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate Blender generator Python syntax
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          source = Path("tools/asset_pipeline/probe_mpfb.py")
          ast.parse(source.read_text(encoding="utf-8"), filename=str(source))
          print("MPFB generator Python syntax OK")
          PY
      - name: Install Blender and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy git libegl1 libgl1 libopengl0 libxkbcommon0 libgl1-mesa-dri xvfb
          ldconfig -p | grep -F libEGL.so.1
          blender --version
      - name: Download MPFB source
        run: |
          git clone --depth 1 https://github.com/makehumancommunity/mpfb2.git /tmp/mpfb2
          test -f /tmp/mpfb2/src/mpfb/__init__.py
      - name: Probe MPFB registration and humanoid operators
        run: |
          mkdir -p build/mpfb
          xvfb-run -a -s '-screen 0 1280x1024x24' blender --background --factory-startup --python tools/asset_pipeline/probe_mpfb.py -- /tmp/mpfb2/src build/mpfb
      - name: Validate both GLB models and chibi proportions
        run: |
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          folder = Path("build/mpfb")
          report = json.loads((folder / "report.json").read_text())
          summary = (folder / "BUILD_SUMMARY.md").read_text(encoding="utf-8")
          assert summary.startswith("# Titan Legends"), "Build summary missing header"
          assert "| Class |" in summary, "Build summary missing comparison table"
          assert not report.get("errors"), report.get("errors")
          for hero_name in ("warrior", "rogue", "shaman", "hunter", "druid",
                            "paladin", "priest", "mage", "warlock", "summoner"):
              assert "| " + hero_name + " |" in summary, hero_name
          assert report.get("human_created") and report.get("chibi_glb_created"), report
          assert report.get("preview_created") and report.get("side_preview_created"), report
          assert report.get("rigged_glb_created"), report
          rig_path = folder / "mpfb_chibi_rigged.glb"
          rig_blob = rig_path.read_bytes()
          assert rig_blob[:4] == b"glTF", "Rigged model is not GLB"
          assert struct.unpack_from("<I", rig_blob, 8)[0] == len(rig_blob), "Rigged GLB length mismatch"
          rig_json_length, rig_json_type = struct.unpack_from("<I4s", rig_blob, 12)
          assert rig_json_type == b"JSON", "Rigged GLB has no JSON chunk"
          rig_gltf = json.loads(rig_blob[20:20 + rig_json_length])
          assert rig_gltf.get("skins"), "Chibi GLB is missing skin bindings"
          assert rig_gltf.get("animations"), "Chibi GLB is missing idle animation"
          rig_nodes = {node.get("name", "") for node in rig_gltf.get("nodes", [])}
          assert {"Root", "Torso", "Head"}.issubset(rig_nodes), (
              "Missing chibi bones", rig_nodes)
          assert len(rig_gltf["skins"][0].get("joints", [])) >= 3, (
              "Chibi skin has fewer than three joints")
          print("Rigged GLB: bones, skin joints and idle animation verified")
          assert report.get("warrior_preview_created"), report
          assert report.get("warrior_side_preview_created"), report
          assert len(report.get("warrior_equipment", [])) >= 7, report
          assert report.get("warrior_hair_parts") == 4, report
          assert report.get("warrior_face_parts") == 9, report
          for preview in ("hero_warrior_front.png", "hero_warrior_side.png"):
              png = (folder / preview).read_bytes()
              assert png[:8] == bytes.fromhex("89504e470d0a1a0a") and len(png) > 1024, preview
          warrior_data = (folder / "hero_warrior_prototype.glb").read_bytes()
          assert warrior_data[:4] == b"glTF", "Warrior GLB invalid header"
          assert struct.unpack_from("<I", warrior_data, 8)[0] == len(warrior_data)
          warrior_json_len, warrior_chunk = struct.unpack_from("<I4s", warrior_data, 12)
          assert warrior_chunk == b"JSON"
          warrior_gltf = json.loads(warrior_data[20:20+warrior_json_len])
          warrior_nodes = {node.get("name", "") for node in warrior_gltf.get("nodes", [])}
          required_parts = {
              "Warrior_Shield", "Warrior_Sword_Blade", "Warrior_Helmet_Crest",
              "Warrior_Hair_Crown", "Warrior_Hair_Fringe",
              "Warrior_Eye_-1", "Warrior_Eye_1",
              "Warrior_Iris_-1", "Warrior_Iris_1",
          }
          assert required_parts.issubset(warrior_nodes), sorted(required_parts - warrior_nodes)
          assert len(warrior_gltf.get("meshes", [])) >= 15, "Warrior accessories missing"
          print("Warrior face, equipment, previews and GLB nodes verified")
          assert len(report.get("hero_prototypes", [])) == 10, report
          lods = report.get("mobile_lod", [])
          assert len(lods) == 10, "Missing mobile LOD exports"
          for lod in lods:
              lod_path = folder / lod["file"]
              assert lod["bytes"] > 1024 and lod_path.is_file(), lod
              blob = lod_path.read_bytes()
              assert blob[:4] == b"glTF" and struct.unpack_from("<I", blob, 8)[0] == len(blob), lod
              assert lod["triangles"] > 0, lod
              assert 0 <= lod["reduction_percent"] <= 100, lod
              assert 0 < lod["body_triangles_after"] <= lod["body_triangles_before"], lod
              # Every MPFB base mesh starts above the 9k-body target.
              assert lod["body_triangles_after"] < lod["body_triangles_before"], (
                  "LOD decimation did not reduce geometry", lod)
              assert lod["body_triangles_after"] <= 10000, (
                  "Mobile LOD body exceeds tolerance", lod)
              print("MOBILE LOD", lod["class"],
                    lod["body_triangles_before"], "->", lod["body_triangles_after"],
                    "triangles; reduction", str(lod["reduction_percent"]) + "%")
          budgets = report.get("mobile_mesh_budget", [])
          assert len(budgets) == 10, "Missing Android mesh budgets"
          for entry in budgets:
              assert entry["triangles"] > 0 and entry["mesh_objects"] > 0, entry
              if not entry["within_target"]:
                  print("ANDROID LOD WARNING:", entry["class"],
                        entry["triangles"], "triangles exceeds target",
                        entry["target_triangles"])
          print("Android prototype mesh budgets:", budgets)
          for hero in report["hero_prototypes"]:
              assert hero["bytes"] > 1024 and (folder / hero["file"]).is_file(), hero
          assert set(("Root", "Torso", "Head")).issubset(report.get("rig_bones", [])), report
          assert (folder / "mpfb_chibi_side.png").read_bytes().startswith(bytes.fromhex("89504e470d0a1a0a"))
          assert report.get("rigged_glb_created"), report
          assert set(report.get("rig_bones", [])) == {"Root", "Torso", "Head"}, report
          assert (folder / "mpfb_chibi_front.png").read_bytes()[:8] == bytes.fromhex("89504e470d0a1a0a")
          for name in ("mpfb_basemesh.glb", "mpfb_chibi_prototype.glb", "mpfb_chibi_rigged.glb"):
              data = (folder / name).read_bytes()
              assert data[:4] == b"glTF", name
              version, size = struct.unpack_from("<II", data, 4)
              assert version == 2 and size == len(data), name
              json_size, kind = struct.unpack_from("<I4s", data, 12)
              assert kind == b"JSON", name
              gltf = json.loads(data[20:20+json_size])
              assert gltf.get("meshes"), name + " has no meshes"
              if name == "mpfb_chibi_rigged.glb":
                  assert gltf.get("skins"), "Rigged model has no exported skin"
                  assert gltf.get("animations"), "Rigged model has no exported animation"
                  assert len(gltf.get("nodes", [])) >= 3, "Rigged model missing skeleton nodes"
              if name == "mpfb_chibi_rigged.glb":
                  assert gltf.get("skins"), "Rigged GLB has no skin"
                  assert gltf.get("animations"), "Rigged GLB has no animations"
              print(name, "meshes", len(gltf["meshes"]), "bytes", len(data))
          print("Chibi geometry validation passed")
          PY
      - name: Verify GLB import in Godot 4.7.2
        run: |
          curl --fail --location --retry 3 --output /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          mkdir -p build/mpfb/godot_check
          printf '[application]\nconfig/name="MPFB Import Probe"\n' > build/mpfb/godot_check/project.godot
          cp build/mpfb/*.glb build/mpfb/godot_check/
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path build/mpfb/godot_check --editor --import --quit
      - name: Publish character build summary
        if: always()
        shell: bash
        run: |
          if [ -f build/mpfb/BUILD_SUMMARY.md ]; then
            cat build/mpfb/BUILD_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## Titan Legends MPFB build\\n\\nNo build summary was generated. Inspect the failed step logs.\\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TitanLegends-MPFB-Probe
          path: build/mpfb/
          if-no-files-found: warn
          retention-days: 14
