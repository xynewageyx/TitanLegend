name: Generate Grasland 3D GLB
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/blender/**'
      - '.github/workflows/generate-grasland.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and GLB dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
      - name: Verify Blender Python dependencies
        run: |
          blender -b --python-expr "import numpy; print('NumPy available:', numpy.__version__)"
      - name: Generate model
        run: |
          blender -b --python tools/blender/generate_grasland.py
          test -s /tmp/grasland.glb
          python3 - <<'PY'
          import json, struct
          p='/tmp/grasland.glb'
          with open(p,'rb') as f:
              header=f.read(12)
          assert len(header)==12 and header[:4]==b'glTF', 'Invalid GLB header'
          assert struct.unpack_from('<I',header,4)[0]==2, 'GLB version must be 2'
          print('GLB export validated')
          PY
      - name: Upload Godot-ready model
        uses: actions/upload-artifact@v4
        with:
          name: TitanLegends-Grasland-GLB
          path: /tmp/grasland.glb
          if-no-files-found: error
      - name: Assemble Godot preview project
        run: |
          mkdir -p preview/assets/worlds/grasland preview/scenes
          cp /tmp/grasland.glb preview/assets/worlds/grasland/grasland.glb
          cp scenes/grasland_preview.tscn preview/scenes/
          cat > preview/project.godot <<'EOF'
          config_version=5

          [application]
          config/name="Titan Legends Grasland Preview"
          run/main_scene="res://scenes/grasland_preview.tscn"
          config/features=PackedStringArray("4.2", "GL Compatibility")

          [display]
          window/size/viewport_width=720
          window/size/viewport_height=1280
          window/handheld/orientation=1

          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
          test -s preview/assets/worlds/grasland/grasland.glb
      - name: Upload standalone Godot preview
        uses: actions/upload-artifact@v4
        with:
          name: TitanLegends-Grasland-Godot-Preview
          path: preview/
          if-no-files-found: error
