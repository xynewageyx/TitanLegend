name: Terrain3D Isolated Godot Import
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/terrain3d-import.yml'
      - 'tools/terrain3d/**'
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate Terrain3D generator Python syntax
        run: python3 -m py_compile tools/terrain3d/stage_addon.py
      - name: Stage official Terrain3D addon
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/terrain3d/stage_addon.py
      - name: Verify ProtonScatter addon installation
        run: |
          test -f terrain3d-preview/addons/proton_scatter/plugin.cfg
          grep -q 'res://addons/proton_scatter/plugin.cfg' terrain3d-preview/project.godot
          echo "ProtonScatter installed and enabled"
      - name: Verify all twelve generated biome scenes
        run: |
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path("terrain3d-preview")
          regions=json.loads((root/"regions.json").read_text())["regions"]
          assert len(regions)==12
          for r in regions:
              key=r["key"]
              for filename in ("gras_albedo.png","erde_albedo.png","weg_albedo.png","fels_albedo.png"):
                  texture=root/"textures"/"terrain"/key/filename
                  assert texture.is_file(),texture
                  assert texture.read_bytes().startswith(bytes.fromhex("89504e470d0a1a0a")),texture
              scene=root/"scenes"/f"{key}_terrain3d.tscn"
              script=root/"scripts"/f"{key}_setup.gd"
              assert scene.is_file() and script.is_file(),key
              assert f"res://terrain_data/{key}" in scene.read_text(),key
              assert f"res://terrain_data/{key}" in script.read_text(),key
          expected_keys = {
              "emerald_grassland", "whisper_forest", "sun_desert",
              "frost_peaks", "ember_volcano", "crystal_caverns",
              "thunder_plateau", "mist_marsh", "sky_islands",
              "shadow_ruins", "coral_archipelago", "astral_citadel",
          }
          assert {r["key"] for r in regions} == expected_keys
          for index, region in enumerate(regions):
              assert region["stage_start"] == index * 100 + 1, region
              assert region["stage_end"] == (index + 1) * 100, region
              assert region["terrain"]["height_amplitude"] > 0, region
              assert len(region["special_features"]["props"]) >= 5, region
              assert len(region["special_features"]["weather"]) >= 2, region
              assert region["performance"]["android_lod"] is True, region
              assert region["performance"]["max_decorative_instances"] <= 120, region
              assert region["performance"]["max_active_weather_particles"] <= 140, region
          scripts = {
              r["key"]: (root / "scripts" / f'{r["key"]}_setup.gd').read_text()
              for r in regions
          }
          assert len(set(scripts.values())) == 12, "Biome scripts are unexpectedly identical"
          for region in regions:
              key = region["key"]
              script = scripts[key]
              assert f"res://textures/terrain/{key}/" in script, key
              assert f"res://terrain_data/{key}" in script, key
              if key not in ("frost_peaks", "ember_volcano"):
                  assert "func _add_biome_landmarks()" in script, key
                  assert "landmark.mesh = spire" in script, key
                  assert "crown.mesh = crown_mesh" in script, key
          for key, required in {
              "frost_peaks": ("FrostPineTip_", "ElementRock_"),
              "ember_volcano": ("EmberBranch_", "ElementRock_"),
              "sun_desert": ("CactusArm_",),
              "whisper_forest": ("crown.scale = Vector3(1.65, 0.40, 1.65)",),
              "mist_marsh": ("MarshReed_",),
          }.items():
              for marker in required:
                  assert marker in scripts[key], f"{key}: missing {marker}"
          for region in regions:
              key = region["key"]
              script = scripts[key]
              barren = region["element"] in ("fire", "ice", "earth", "arcane", "lightning", "dark", "light")
              expected_trees = 8 if barren else 20
              expected_rocks = 20 if barren else 16
              assert "for i in range(%d):" % expected_trees in script, key
              assert "for i in range(%d):" % expected_rocks in script, key
          print("Verified mobile decoration density in all 12 biomes")
          print("Verified biome-specific vegetation and elemental rocks")
          print("Verified 12 unique biome scripts, textures, terrain paths and geometry")
          print("Verified 1200 stages, biome features, and Android budgets")
          print("Verified 12 independent Terrain3D biomes")
          PY
      - name: Verify generated biome landmark and weather hooks
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("terrain3d-preview")
          regions = json.loads((root / "regions.json").read_text())["regions"]
          for region in regions:
              key = region["key"]
              script = (root / "scripts" / f"{key}_setup.gd").read_text()
              if key in ("frost_peaks", "ember_volcano"):
                  assert "func _add_elemental_environment()" in script, key
                  assert "_add_elemental_environment()" in script.split("func _add_elemental_environment()")[0], key
                  assert ("Snowstorm" if key == "frost_peaks" else "Ashfall") in script, key
              else:
                  assert "func _add_biome_landmarks()" in script, key
                  assert "_add_biome_landmarks()" in script.split("func _add_biome_landmarks()")[0], key
                  assert "Landmark_%02d" in script, key
              assert "\\n" not in script, f"Literal escaped newline in {key}"
              print("BIOME_HOOK_VALID", key)
          PY
      - name: Verify bundled terrain textures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct,zlib
          folder=Path('terrain3d-preview/textures/terrain')
          for name in ('gras','erde','weg','fels'):
              data=(folder/(name+'_albedo.png')).read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', name
              assert data[12:16] == b'IHDR', name
              width,height=struct.unpack('>II',data[16:24])
              assert (width,height)==(256,256), name
              assert zlib.crc32(b'IHDR'+data[16:29]) & 0xffffffff == struct.unpack('>I',data[29:33])[0], name
              print('VALID_TERRAIN_PNG',name,width,height)
          PY
      - name: Verify generated scene structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("terrain3d-preview/scenes/terrain3d_node_test.tscn")
          s=p.read_text()
          print("Scene repr:",repr(s[:240]))
          assert s.startswith("[gd_scene"), "Scene header missing"
          assert '\\n' not in s, "Literal backslash-n sequences found"
          assert s.count("\n") >= 4, "Scene has too few lines"
          assert 'type="Terrain3D"' in s, "Terrain3D node missing"
          PY
      - name: Download Godot 4.7.2 stable
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
      - name: Install crash diagnostics
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb
      - name: Import addon in Godot with crash backtrace
        run: |
          set +e
          GODOT="$(find /tmp/godot-bin -maxdepth 1 -type f -name 'Godot*' | head -n 1)"
          chmod +x "$GODOT"
          mkdir -p terrain3d-diagnostics
          gdb -batch -ex "set pagination off" -ex run -ex "thread apply all bt 20" --args "$GODOT" --headless --path terrain3d-preview --editor --import --quit > terrain3d-diagnostics/gdb-import.log 2>&1
          status=$?
          cat terrain3d-diagnostics/gdb-import.log
          echo "$status" > terrain3d-diagnostics/gdb-exit-code.txt
          exit "$status"
      - name: Upload crash diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Terrain3D-Godot472-Diagnostics
          path: terrain3d-diagnostics/
          if-no-files-found: warn
      - name: Test Terrain3D node scene loading
        run: |
          GODOT="$(find /tmp/godot-bin -maxdepth 1 -type f -name 'Godot*' | head -n 1)"
          "$GODOT" --headless --path terrain3d-preview --quit-after 3 res://scenes/terrain3d_node_test.tscn
      - name: Test procedural grassland scene
        run: |
          set -o pipefail
          GODOT="$(find /tmp/godot-bin -maxdepth 1 -type f -name 'Godot*' | head -n 1)"
          "$GODOT" --headless --path terrain3d-preview --quit-after 5 res://scenes/grasland_terrain3d.tscn 2>&1 | tee /tmp/grasland.log
          grep -q GRASLAND_REGION_READY /tmp/grasland.log
          # A generated heightmap alone can still display as a checkerboard.
          # Require four registered Terrain3D texture assets and their source PNGs.
          grep -Eq 'TERRAIN_TEXTURE_ASSETS_READY:[[:space:]]*4' /tmp/grasland.log || {
            echo "Expected four Terrain3D texture assets; rendering may show a checkerboard"
            cat /tmp/grasland.log
            exit 1
          }
          for surface in gras erde weg fels; do
            test -s "terrain3d-preview/textures/terrain/${surface}_albedo.png" || {
              echo "Missing terrain surface: ${surface}"
              exit 1
            }
          done
          grep -q GRASLAND_PATH_AND_ARENA_READY /tmp/grasland.log
          grep -q GRASLAND_PROPS_READY /tmp/grasland.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/grasland.log; then exit 1; fi
          test -d terrain3d-preview/terrain_data
      - name: Smoke-test all twelve biome scripts in Godot
        run: |
          set -euo pipefail
          GODOT="$(find /tmp/godot-bin -maxdepth 1 -type f -name 'Godot*' | head -n 1)"
          for key in $(python3 -c 'import json; print(" ".join(r["key"] for r in json.load(open("terrain3d-preview/regions.json"))["regions"]))'); do
            scene="terrain3d-preview/scenes/${key}_terrain3d.tscn"
            name="$(basename "$scene")"
            echo "Testing biome: $name"
            "$GODOT" --headless --path terrain3d-preview --quit-after 5 "res://scenes/$name" > /tmp/biome-smoke.log 2>&1 || {
              cat /tmp/biome-smoke.log
              exit 1
            }
            if [[ "$name" == "frost_peaks_terrain3d.tscn" || "$name" == "ember_volcano_terrain3d.tscn" ]]; then
              grep -q ELEMENTAL_ENVIRONMENT_READY /tmp/biome-smoke.log || { cat /tmp/biome-smoke.log; exit 1; }
            else
              grep -q BIOME_LANDMARKS_READY /tmp/biome-smoke.log || { cat /tmp/biome-smoke.log; exit 1; }
            fi
            if ! grep -Eq 'TERRAIN_TEXTURE_ASSETS_READY:[[:space:]]*4' /tmp/biome-smoke.log; then
              echo "::error::Biome $key did not register all four Terrain3D textures"
              cat /tmp/biome-smoke.log
              exit 1
            fi
            for surface in gras erde weg fels; do
              if ! test -s "terrain3d-preview/textures/terrain/$key/${surface}_albedo.png"; then
                echo "::error::Missing $surface terrain texture for $key"
                exit 1
              fi
            done
            if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid assignment' /tmp/biome-smoke.log; then
              cat /tmp/biome-smoke.log
              exit 1
            fi
          done
          echo "All twelve biome scenes loaded without reported script errors"
      - name: Install preview video decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
      - name: Capture optional biome preview frames
        continue-on-error: true
        timeout-minutes: 9
        run: |
          set -euo pipefail
          command -v ffmpeg
          GODOT="$(find /tmp/godot-bin -maxdepth 1 -type f -name 'Godot*' | head -n 1)"
          mkdir -p terrain3d-previews
          for key in emerald_grassland whisper_forest sun_desert frost_peaks ember_volcano crystal_caverns thunder_plateau mist_marsh sky_islands shadow_ruins coral_archipelago astral_citadel; do
            echo "Rendering optional preview: $key"
            set +e
            timeout 20s xvfb-run -a "$GODOT" --path terrain3d-preview --rendering-method gl_compatibility --resolution 960x540 --write-movie "/tmp/$key.avi" --fixed-fps 30 --quit-after 12 "res://scenes/${key}_terrain3d.tscn" > "/tmp/$key-preview.log" 2>&1
            capture_exit=$?
            set -e
            if [ "$capture_exit" -eq 124 ]; then
              echo "::warning::Godot timed out while capturing $key"
            elif [ "$capture_exit" -ne 0 ]; then
              echo "::warning::Godot exited with code $capture_exit while capturing $key"
            fi
            echo "Capture exit code: $capture_exit" >> "/tmp/$key-preview.log"
            if test -s "/tmp/$key.avi"; then
              echo "AVI bytes: $(stat -c %s "/tmp/$key.avi")" >> "/tmp/$key-preview.log"
            else
              echo "AVI missing or empty" >> "/tmp/$key-preview.log"
            fi
            if test -s "/tmp/$key.avi"; then
              ffmpeg -hide_banner -loglevel error -y -sseof -0.2 -i "/tmp/$key.avi" -frames:v 1 "terrain3d-previews/$key.png" || ffmpeg -hide_banner -loglevel error -y -i "/tmp/$key.avi" -frames:v 1 "terrain3d-previews/$key.png" || true
            fi
            cp "/tmp/$key-preview.log" "terrain3d-previews/$key.log"
            if test -s "terrain3d-previews/$key.png"; then
              echo "Captured $key: $(stat -c %s "terrain3d-previews/$key.png") bytes"
            else
              echo "::warning::No preview PNG for $key; see terrain3d-previews/$key.log"
            fi
          done
      - name: Summarize biome preview capture
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('terrain3d-previews')
          root.mkdir(exist_ok=True)
          keys = 'emerald_grassland whisper_forest sun_desert frost_peaks ember_volcano crystal_caverns thunder_plateau mist_marsh sky_islands shadow_ruins coral_archipelago astral_citadel'.split()
          def valid_png(path):
              if not path.is_file() or path.stat().st_size < 1024:
                  return False
              with path.open('rb') as stream:
                  header = stream.read(24)
              if header[:8] != bytes.fromhex('89504e470d0a1a0a') or header[12:16] != b'IHDR':
                  return False
              width = int.from_bytes(header[16:20], 'big')
              height = int.from_bytes(header[20:24], 'big')
              if width < 320 or height < 180:
                  return False
              # Reject effectively black captures even when the PNG header is valid.
              import subprocess
              probe = subprocess.run(
                  ['ffmpeg', '-hide_banner', '-loglevel', 'error', '-i', str(path),
                   '-vf', 'scale=32:18,format=gray', '-f', 'rawvideo', '-frames:v', '1', '-'],
                  capture_output=True, check=False, timeout=15)
              if probe.returncode != 0 or len(probe.stdout) != 32 * 18:
                  return False
              pixels = probe.stdout
              return sum(pixels) / len(pixels) >= 12 and max(pixels) - min(pixels) >= 8
          status = {key: {'png': valid_png(root / (key + '.png')), 'log': (root / (key + '.log')).is_file()} for key in keys}
          (root / 'status.json').write_text(json.dumps(status, indent=2))
          lines = ['### Terrain3D preview capture', '', '| Biome | Result |', '|---|---|']
          for key, result in status.items():
              lines.append('| ' + key + ' | ' + ('PNG available' if result['png'] else 'No PNG; inspect log') + ' |')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('\n'.join(lines) + '\n')
          print('Captured', sum(item['png'] for item in status.values()), 'of', len(keys), 'preview PNGs')
          PY
      - name: Create biome comparison contact sheet
        if: always()
        continue-on-error: true
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, json
          root = Path('terrain3d-previews')
          status = json.loads((root / 'status.json').read_text())
          images = [root / (key + '.png') for key, item in status.items() if item['png']]
          if not images:
              print('No PNG previews to combine')
          else:
              args = ['ffmpeg', '-hide_banner', '-loglevel', 'error', '-y']
              for image in images:
                  args += ['-i', str(image)]
              filters = ';'.join(f'[{i}:v]scale=320:180:force_original_aspect_ratio=decrease,pad=320:180:(ow-iw)/2:(oh-ih)/2[v{i}]' for i in range(len(images)))
              filters += ';' + ''.join(f'[v{i}]' for i in range(len(images))) + f'xstack=inputs={len(images)}:layout=' + '|'.join(f'{i%3*320}_{i//3*180}' for i in range(len(images))) + '[out]'
              args += ['-filter_complex', filters, '-map', '[out]', '-frames:v', '1', str(root / 'biome-comparison.png')]
              subprocess.run(args, check=True)
              print('Created comparison sheet from', len(images), 'images')
          PY
      - name: Upload optional biome previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Terrain3D-Biome-Previews
          path: terrain3d-previews/
          if-no-files-found: ignore
      - name: Require at least one usable biome preview
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path("terrain3d-previews/status.json").read_text())
          valid = [name for name, result in status.items() if result["png"]]
          print("Usable biome previews:", len(valid), "of", len(status))
          if not valid:
              for name in status:
                  log = Path("terrain3d-previews") / (name + ".log")
                  if log.exists():
                      lines = log.read_text(errors="replace").splitlines()
                      print(f"--- {name} (last 15 lines) ---")
                      print("\n".join(lines[-15:]))
              raise SystemExit("No usable PNG previews. Inspect Terrain3D-Biome-Previews logs and video capture.")
          PY
      - name: Verify Terrain3D native extension registration
        run: |
          GODOT="$(find /tmp/godot-bin -maxdepth 1 -type f -name 'Godot*' | head -n 1)"
          cp tools/terrain3d/verify_terrain3d.gd terrain3d-preview/verify_terrain3d.gd
          "$GODOT" --headless --path terrain3d-preview --script res://verify_terrain3d.gd
      - name: Upload isolated test project
        uses: actions/upload-artifact@v4
        with:
          name: Terrain3D-Isolated-Godot-Test
          path: terrain3d-preview/
