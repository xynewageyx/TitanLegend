name: Terrain3D Isolated Godot Import
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/terrain3d-import.yml'
      - 'tools/terrain3d/stage_addon.py'
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Stage official Terrain3D addon
        run: python3 tools/terrain3d/stage_addon.py
      - name: Download Godot 4.4.1
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
      - name: Import addon in Godot
        run: |
          GODOT="$(find /tmp/godot-bin -maxdepth 1 -type f -name 'Godot*' | head -n 1)"
          chmod +x "$GODOT"
          "$GODOT" --headless --path terrain3d-preview --editor --import --quit
      - name: Upload isolated test project
        uses: actions/upload-artifact@v4
        with:
          name: Terrain3D-Isolated-Godot-Test
          path: terrain3d-preview/
