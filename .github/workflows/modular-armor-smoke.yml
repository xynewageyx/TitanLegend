name: Modular Armor Godot Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/equipment/chibi_armor_piece.gd'
      - 'scripts/equipment/equipment_inventory_visual_bridge.gd'
      - 'scripts/equipment/modular_equipment_inspection.gd'
      - 'tests/character/test_combat_equipment_visuals.gd'
      - 'tests/test_modular_armor_geometry.py'
      - 'tests/character/test_modular_armor.gd'
      - '.github/workflows/modular-armor-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  armor-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf original_update168
          godot --headless --path . --editor --import --quit 2>&1 | tee /tmp/armor-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script' /tmp/armor-import.log; then
            exit 1
          fi
      - name: Test all modular armor shapes in Godot
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/character/test_modular_armor.gd 2>&1 | tee /tmp/armor-smoke.log
          grep -Fq 'ARMOR SMOKE PASSED: 78 armor combinations' /tmp/armor-smoke.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script' /tmp/armor-smoke.log; then
            exit 1
          fi
      - name: Verify combat equipment visuals for all 12 classes
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/character/test_combat_equipment_visuals.gd 2>&1 | tee /tmp/combat-equipment-smoke.log
          grep -Fq 'COMBAT_EQUIPMENT_VISUALS_OK: all 12 classes' /tmp/combat-equipment-smoke.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:' /tmp/combat-equipment-smoke.log; then
            exit 1
          fi
