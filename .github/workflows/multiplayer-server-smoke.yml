name: Multiplayer test server smoke
on:
  push:
    paths:
      - 'scripts/server/**'
      - 'scripts/chat/**'
      - 'scenes/titan_multiplayer_test_server.tscn'
      - '.github/workflows/multiplayer-server-smoke.yml'
  pull_request:
    paths:
      - 'scripts/server/**'
      - 'scripts/chat/**'
      - 'scenes/titan_multiplayer_test_server.tscn'
      - '.github/workflows/multiplayer-server-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  headless-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          sudo mv /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import project
        run: |
          rm -rf original_update168
          godot --headless --path . --editor --import --quit
      - name: Boot headless server and verify startup
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout 12s godot --headless --path . res://scenes/titan_multiplayer_test_server.tscn > /tmp/server.log 2>&1
          status=$?
          set -e
          cat /tmp/server.log
          if [ "$status" -ne 124 ]; then
            echo "Server exited unexpectedly with status $status"
            exit 1
          fi
          grep -F "Titan Legends headless test server listening on UDP 24567" /tmp/server.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|ERROR:" /tmp/server.log; then
            echo "Godot reported a startup error"
            exit 1
          fi
