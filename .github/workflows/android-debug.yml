name: Titan Legends Android debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GODOT_VERSION: "4.6"
      GODOT_RELEASE: "4.6-stable"
      ANDROID_API_LEVEL: "35"
    steps:
      - name: Checkout latest Titan Legends source
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android command line tools
        uses: android-actions/setup-android@v3

      - name: Install Godot 4.6 Android SDK requirements
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"
          test -f "${ANDROID_HOME}/platform-tools/adb"
          test -d "${ANDROID_HOME}/platforms/android-35"
          test -d "${ANDROID_HOME}/build-tools/35.0.1"

      - name: Install Godot editor and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output "${RUNNER_TEMP}/godot-editor.zip" \
            "https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip"
          unzip -q "${RUNNER_TEMP}/godot-editor.zip" -d "${RUNNER_TEMP}"
          install -m 755 "${RUNNER_TEMP}/Godot_v4.6-stable_linux.x86_64" "${RUNNER_TEMP}/godot"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"
          curl --fail --location --retry 3 \
            --output "${RUNNER_TEMP}/godot-templates.tpz" \
            "https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz"
          unzip -q "${RUNNER_TEMP}/godot-templates.tpz" -d "${RUNNER_TEMP}/export-templates"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.stable"
          cp -a "${RUNNER_TEMP}/export-templates/templates/." \
            "$HOME/.local/share/godot/export_templates/4.6.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.6.stable/android_debug.apk"
          "${RUNNER_TEMP}/godot" --version

      - name: Create temporary debug signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass android -keypass android \
            -keystore "${RUNNER_TEMP}/titan-debug.keystore" \
            -dname "CN=Android Debug,O=Titan Legends,C=DE"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=${RUNNER_TEMP}/titan-debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Verify Android export preset
        shell: bash
        run: |
          set -euo pipefail
          test -s project.godot
          test -s scenes/main.tscn
          test -s export_presets.cfg
          grep -q '^name="Android"' export_presets.cfg

      - name: Import Godot resources and parse project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --import --quit

      - name: Export signed Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/TitanLegends-debug.apk
          test -s build/TitanLegends-debug.apk
          file build/TitanLegends-debug.apk
          sha256sum build/TitanLegends-debug.apk | tee build/SHA256SUMS.txt
          {
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Workflow run: ${GITHUB_RUN_ID}"
            echo "Engine: Godot 4.6 stable"
            echo "APK: TitanLegends-debug.apk"
            echo "Warning: temporary debug signing key changes between builds."
          } > build/BUILD_INFO.txt

      - name: Upload Android APK and source commit information
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TitanLegends-Android-debug-${{ github.run_number }}
          path: |
            build/TitanLegends-debug.apk
            build/SHA256SUMS.txt
            build/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30
