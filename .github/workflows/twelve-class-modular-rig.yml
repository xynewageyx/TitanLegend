name: Twelve-class animated modular equipment (Godot 4.7.2)
on:
  pull_request:
    paths:
      - 'scripts/character/modular_character.gd'
      - 'scripts/character/titan_modular_rig_animation.gd'
      - 'scenes/character/titan_modular_character.tscn'
      - 'tests/character/test_animated_equipment_twelve_classes.gd'
      - 'scripts/team_formation.gd'
      - 'scripts/hero_combat_motion.gd'
      - 'scripts/equipment/live_formation_rig_bridge.gd'
      - 'scripts/equipment/hero_equipment_sockets.gd'
      - 'scripts/equipment/chibi_imported_equipment_sockets.gd'
      - 'scripts/chibi_glb_visual.gd'
      - 'tests/test_live_formation_animated_equipment.gd'
      - 'tests/test_imported_chibi_rig_animation_audit.gd'
      - '.github/workflows/twelve-class-modular-rig.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/character/modular_character.gd'
      - 'scripts/character/titan_modular_rig_animation.gd'
      - 'scenes/character/titan_modular_character.tscn'
      - 'tests/character/test_animated_equipment_twelve_classes.gd'
      - 'scripts/team_formation.gd'
      - 'scripts/hero_combat_motion.gd'
      - 'scripts/equipment/live_formation_rig_bridge.gd'
      - 'scripts/equipment/hero_equipment_sockets.gd'
      - 'scripts/equipment/chibi_imported_equipment_sockets.gd'
      - 'scripts/chibi_glb_visual.gd'
      - 'tests/test_live_formation_animated_equipment.gd'
      - 'tests/test_imported_chibi_rig_animation_audit.gd'
      - '.github/workflows/twelve-class-modular-rig.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  twelve-class-animated-equipment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version | grep -F '4.7.2.stable'
      - name: Prepare the existing Titan Legends project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf original_update168
          python3 tools/generate_audio_sfx.py
          timeout 180s godot --headless --path . --editor --import --quit 2>&1 | tee /tmp/titan-modular-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script' /tmp/titan-modular-import.log; then
            exit 1
          fi
      - name: Exercise the actual modular hero prefab, armor, weapons and bone animations
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s godot --headless --path . --script res://tests/character/test_animated_equipment_twelve_classes.gd 2>&1 | tee /tmp/titan-modular-hero.log
          grep -Fq 'TITAN_12_CLASS_ANIMATED_EQUIPMENT_OK classes=12 rarities=3 armor_placements=468' /tmp/titan-modular-hero.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:' /tmp/titan-modular-hero.log; then
            exit 1
          fi
      - name: Exercise the existing four-hero formation with animated equipment
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s godot --headless --path . --quit-after 900 --script res://tests/test_live_formation_animated_equipment.gd 2>&1 | tee /tmp/titan-live-formation-rig.log
          grep -Fq 'LIVE_FORMATION_ANIMATED_EQUIPMENT_OK heroes=4 bone_sockets=60 imported_sockets=4' /tmp/titan-live-formation-rig.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:' /tmp/titan-live-formation-rig.log; then
            exit 1
          fi
      - name: Inspect twelve imported original GLB skeletons and animation clips
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s godot --headless --path . --script res://tests/test_imported_chibi_rig_animation_audit.gd 2>&1 | tee /tmp/titan-chibi-rig-audit.log
          grep -Fq 'CHIBI_IMPORTED_RIG_AUDIT_OK classes=12 bones=112 full_clip_sets=12 sockets=180' /tmp/titan-chibi-rig-audit.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:' /tmp/titan-chibi-rig-audit.log; then
            exit 1
          fi
