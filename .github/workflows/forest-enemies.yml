name: Forest enemy GLB generator
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/blender/generate_forest_mobs.py'
      - 'tools/analysis/inspect_forest_glbs.py'
      - '.github/workflows/forest-enemies.yml'
      - 'tools/tests/test_forest_animations.gd'
      - 'scripts/battle_manager.gd'
      - 'scripts/forest_enemy_visual.gd'
      - 'scripts/enemies/forest_enemy_visual.gd'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: sudo apt-get update && sudo apt-get install -y blender python3-numpy
      - name: Verify Blender Python NumPy dependency
        run: blender --background --python-expr "import numpy; print('NumPy OK', numpy.__version__)"
      - name: Generate forest GLBs
        run: blender --background --python tools/blender/generate_forest_mobs.py -- --output build/forest
      - name: Measure actual forest GLB geometry
        run: python3 tools/analysis/inspect_forest_glbs.py --input build/forest --output build/forest-geometry-report.csv
      - name: Check generated files
        run: |
          test -s build/forest/forest_01_mooshuepfer.glb
          test -s build/forest/forest_02_pilzling.glb
          test -s build/forest/forest_03_wurzelkrabbler.glb
          test -s build/forest/forest_04_blattfuchs.glb
          test -s build/forest/forest_05_dorneneber.glb
          test -s build/forest/forest_06_rankenwerfer.glb
          test -s build/forest/forest_elite_01_rindenwaechter.glb
          test -s build/forest/forest_elite_02_moosbestie.glb
          test -s build/forest/forest_boss_01_wurzelkoenig.glb
          python3 - <<'PY'
          import pathlib, struct, json
          paths = sorted(pathlib.Path('build/forest').glob('*.glb'))
          assert len(paths) == 9, f'Expected 9 GLBs, got {len(paths)}'
          for path in paths:
              data = path.read_bytes()
              assert len(data) >= 20 and data[:4] == b'glTF', f'Invalid GLB: {path}'
              assert struct.unpack_from('<I', data, 8)[0] == len(data), f'Wrong GLB length: {path}'
              chunk_size, chunk_type = struct.unpack_from('<II', data, 12)
              assert chunk_type == 0x4E4F534A, f'No JSON chunk: {path}'
              doc = json.loads(data[20:20+chunk_size])
              names = {a.get('name', '').split('.')[0] for a in doc.get('animations', [])}
              required = {'idle', 'attack', 'hit', 'death'}
              assert names == required, f'Expected exactly four animations in {path}; found {names}'
              animations = doc.get('animations', [])
              assert len(animations) == 4, f'Unexpected animation count in {path}: {len(animations)}'
              for animation in animations:
                  channels = animation.get('channels', [])
                  samplers = animation.get('samplers', [])
                  assert channels and samplers, f'Empty animation in {path}: {animation.get("name")}'
                  targets = set()
                  for channel in channels:
                      assert 0 <= channel['sampler'] < len(samplers), f'Invalid sampler in {path}'
                      target = channel['target']
                      assert isinstance(target.get('node'), int), f'Animation target missing node in {path}'
                      assert 0 <= target['node'] < len(doc.get('nodes', [])), f'Invalid animation node in {path}'
                      assert target.get('path') in {'translation', 'rotation', 'scale', 'weights'}, f'Invalid animation path in {path}'
                      key = (target.get('node'), target.get('path'))
                      assert key not in targets, f'Duplicate animation target in {path}: {key}'
                      targets.add(key)
                  assert any(doc['nodes'][node].get('name', '').startswith('CreatureRoot') for node, _ in targets), f'Root motion missing from {path}: {animation["name"]}'
              meshes = doc.get('meshes', [])
              assert len(meshes) >= 8, f'Unexpectedly simple or empty mesh scene: {path} ({len(meshes)} meshes)'
              nodes = doc.get('nodes', [])
              assert nodes, f'No scene nodes: {path}'
              assert doc.get('materials'), f'No GLB materials: {path}'
              for mesh in meshes:
                  for primitive in mesh.get('primitives', []):
                      assert 'POSITION' in primitive.get('attributes', {}), f'Mesh missing positions: {path}'
              assert any('CreatureRoot' in n.get('name','') for n in nodes), f'Missing animated root: {path}'
              print(path, len(data), 'bytes; meshes:', len(meshes), 'nodes:', len(nodes), 'animations:', sorted(names))
          PY
      - name: Package models at Godot resource paths
        run: |
          mkdir -p godot-import/assets/enemies/forest
          cp build/forest/*.glb godot-import/assets/enemies/forest/
          test "$(find godot-import/assets/enemies/forest -name '*.glb' | wc -l)" -eq 9
      - name: Exclude archived snapshots from Godot import
        run: |
          # Archived copies can reintroduce globally registered GDScript classes.
          # Keep the active game untouched and isolate old snapshots for CI import.
          if test -d original_update168; then
            mv original_update168 "${RUNNER_TEMP}/titan_original_update168"
          fi
      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Install software OpenGL display
        run: sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Import GLB assets with Godot
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p assets/enemies/forest
          cp build/forest/*.glb assets/enemies/forest/
          set -o pipefail
          xvfb-run -a godot --rendering-driver opengl3 --path . --editor --import --quit 2>&1 | tee godot-forest-import.log
          if grep -E 'ERROR: Parameter "t" is null|SCRIPT ERROR:|Parse Error:|Failed to load script' godot-forest-import.log; then
            echo 'Godot reported import or script errors'
            exit 1
          fi
      - name: Test all forest animations in Godot
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          xvfb-run -a godot --headless --rendering-driver opengl3 --path . --script res://tools/tests/test_forest_animations.gd 2>&1 | tee godot-forest-animation-test.log
          grep -q 'FOREST ANIMATION TEST PASSED: 36 clips on 9 enemies' godot-forest-animation-test.log
      - name: Upload measured forest geometry
        uses: actions/upload-artifact@v4
        with:
          name: TitanLegends-Forest-Geometry-Report
          path: build/forest-geometry-report.csv
          if-no-files-found: error
      - name: Upload forest animation test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TitanLegends-Forest-Animation-Test-Log
          path: godot-forest-animation-test.log
          if-no-files-found: ignore
      - name: Upload Godot import diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TitanLegends-Forest-Import-Log
          path: godot-forest-import.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: TitanLegends-Forest-Mobs-GLB
          path: build/forest/*.glb

      - uses: actions/upload-artifact@v4
        with:
          name: TitanLegends-Forest-Godot-Import
          path: godot-import/assets/enemies/forest/*.glb
