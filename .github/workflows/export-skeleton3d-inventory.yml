name: Export Titan Legends Skeleton3D inventory

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-skeleton3d-inventory.yml
      - tools/audit_titan_twelve_rigs.py
      - tools/audit_titan_rig_pose_compatibility.py
      - tools/export_twelve_class_bone_motion.gd
      - tools/analyze_twelve_class_bone_motion.py
      - tests/test_analyze_twelve_class_bone_motion.py
      - tests/test_audit_titan_rig_pose_compatibility.py
      - tests/test_audit_titan_twelve_rigs.py
      - tools/export_skeleton3d_inventory.gd
      - tools/validate_skeleton3d_inventory.py
  push:
    branches:
      - main
    paths:
      - .github/workflows/export-skeleton3d-inventory.yml
      - tools/export_skeleton3d_inventory.gd
      - tools/validate_skeleton3d_inventory.py
      - tools/test_chibi_pose_smoke.gd
      - tools/test_chibi_animation_keyframes.gd
      - tools/test_chibi_animation_player_smoke.gd
      - tools/test_chibi_animation_controller.gd
      - scripts/animation/chibi_animation_controller.gd
      - tools/export_chibi_animation_inventory.gd
      - tools/analyze_chibi_animation_inventory.py
      - tools/audit_chibi_animation_duplicates.py
      - tests/test_validate_skeleton3d_inventory.py
      - tests/test_audit_titan_twelve_rigs.py
      - tools/audit_titan_twelve_rigs.py
      - tests/test_analyze_chibi_animation_inventory.py
      - tests/test_audit_chibi_animation_duplicates.py

jobs:
  export-skeletons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Skeleton3D inventory validator
        run: python3 -m unittest discover -s tests -p 'test_validate_skeleton3d_inventory.py' -v
      - name: Test twelve-class rig coverage auditor
        run: python3 -m unittest discover -s tests -p 'test_audit_titan_twelve_rigs.py' -v
      - name: Test twelve-class rest-pose and equipment-socket auditor
        run: python3 -m unittest discover -s tests -p 'test_audit_titan_rig_pose_compatibility.py' -v
      - name: Test twelve-class motion analyzer
        run: python3 -m unittest discover -s tests -p 'test_analyze_twelve_class_bone_motion.py' -v
      - name: Test Chibi animation coverage analyzer
        run: python3 -m unittest discover -s tests -p 'test_analyze_chibi_animation_inventory.py' -v
      - name: Test Chibi animation duplicate auditor
        run: python3 -m unittest discover -s tests -p 'test_audit_chibi_animation_duplicates.py' -v
      - name: Install Godot headless
        run: |
          set -euo pipefail
          GODOT_VERSION="4.7.2"
          URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fL --retry 3 "$URL" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          GODOT_BIN="$(find /tmp -maxdepth 1 -type f -name 'Godot_v*-stable_linux.x86_64' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Import project
        run: |
          "$GODOT_BIN" --headless --editor --path . --import --quit
      - name: Smoke-test Chibi bone posing
        run: |
          "$GODOT_BIN" --headless --path . --script res://tools/test_chibi_pose_smoke.gd
      - name: Smoke-test Chibi animation keyframes
        run: |
          "$GODOT_BIN" --headless --path . --script res://tools/test_chibi_animation_keyframes.gd
      - name: Smoke-test actual AnimationPlayer bone posing
        run: |
          "$GODOT_BIN" --headless --path . --script res://tools/test_chibi_animation_player_smoke.gd
      - name: Smoke-test imported Chibi animation controller
        run: |
          "$GODOT_BIN" --headless --path . --script res://tools/test_chibi_animation_controller.gd
      - name: Export imported Chibi animation metadata
        run: |
          "$GODOT_BIN" --headless --path . --script res://tools/export_chibi_animation_inventory.gd
          test -s build/chibi_animation_inventory.json
      - name: Analyze imported Chibi animation coverage
        run: |
          python3 tools/analyze_chibi_animation_inventory.py build/chibi_animation_inventory.json --output build/chibi_animation_coverage.json
      - name: Audit possible duplicate Chibi animation metadata
        run: |
          python3 tools/audit_chibi_animation_duplicates.py build/chibi_animation_inventory.json --output build/chibi_animation_duplicate_audit.json
      - name: Export skeleton hierarchy and rest poses
        run: |
          mkdir -p build
          "$GODOT_BIN" --headless --path . --script res://tools/export_skeleton3d_inventory.gd -- --output build/skeleton3d_inventory.json
          test -s build/skeleton3d_inventory.json
      - name: Validate exported skeletons and rest poses
        run: |
          python3 tools/validate_skeleton3d_inventory.py build/skeleton3d_inventory.json --output build/skeleton3d_validation.json --allow-empty-scene res://scenes/character/titan_modular_character.tscn
      - name: Audit twelve imported class rigs
        if: always()
        run: |
          mkdir -p build
          if [ -s build/skeleton3d_inventory.json ]; then
            python3 tools/audit_titan_twelve_rigs.py build/skeleton3d_inventory.json --output build/twelve_class_rig_coverage.json || true
          else
            printf '{"complete": false, "error": "Skeleton3D inventory missing"}\n' > build/twelve_class_rig_coverage.json
          fi
      - name: Audit twelve-class rest poses and equipment sockets
        if: always()
        run: |
          if [ -s build/skeleton3d_inventory.json ]; then
            python3 tools/audit_titan_rig_pose_compatibility.py build/skeleton3d_inventory.json --output build/twelve_class_pose_compatibility.json
          else
            mkdir -p build
            printf '{"valid": false, "error": "Skeleton3D inventory missing"}\n' > build/twelve_class_pose_compatibility.json
            exit 1
          fi
      - name: Quantify bone movement in four original GLB actions
        run: |
          "$GODOT_BIN" --headless --path . --script res://tools/export_twelve_class_bone_motion.gd
          test -s build/twelve_class_bone_motion.json
      - name: Evaluate Death Knight hand motion and Idle Walk observations
        run: |
          python3 tools/analyze_twelve_class_bone_motion.py build/twelve_class_bone_motion.json --output build/twelve_class_motion_report.json
      - name: Upload inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-skeleton3d-inventory
          path: |
            build/skeleton3d_inventory.json
            build/skeleton3d_validation.json
            build/twelve_class_rig_coverage.json
            build/twelve_class_pose_compatibility.json
            build/twelve_class_bone_motion.json
            build/twelve_class_motion_report.json
            build/chibi_animation_inventory.json
            build/chibi_animation_coverage.json
            build/chibi_animation_duplicate_audit.json
          if-no-files-found: warn
