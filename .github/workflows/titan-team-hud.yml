name: Titan team HUD focused test
on:
  pull_request:
    paths:
      - 'ui/team/**'
      - 'tests/test_titan_team_hud.gd'
      - 'scenes/main.tscn'
      - '.github/workflows/titan-team-hud.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  team-hud:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf original_update168
          python3 tools/generate_audio_sfx.py
          godot --headless --path . --editor --import --quit
      - name: Validate four-hero team HUD
        shell: bash
        run: godot --headless --path . --script res://tests/test_titan_team_hud.gd
