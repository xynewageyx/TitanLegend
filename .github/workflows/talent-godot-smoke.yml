name: Talent UI Godot smoke
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/talent_menu_v2.gd'
      - 'scripts/talent_tree_v2.gd'
      - 'scripts/talent_combat_adapter_v2.gd'
      - 'scripts/team_formation.gd'
      - 'scripts/save_manager.gd'
      - 'scripts/battle_manager.gd'
      - 'tests/test_talent_menu_v2.py'
      - '.github/workflows/talent-godot-smoke.yml'
jobs:
  godot-talent-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check talent integration regressions
        run: python3 -m unittest discover -s tests -p 'test_talent_menu_v2.py' -v
      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
      - name: Install software OpenGL display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Import and parse project scripts
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          xvfb-run -a godot --rendering-driver opengl3 --path . --editor --import --quit 2>&1 | tee godot-talent-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR: Parameter "t" is null' godot-talent-import.log; then
            echo 'Godot script/import diagnostics detected'
            exit 1
          fi
      - name: Upload Godot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TitanLegends-Talent-Godot-Log
          path: godot-talent-import.log
          if-no-files-found: ignore
