name: Titan Legends Android Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'export_presets.cfg'
      - 'project.godot'
      - 'scripts/**'
      - 'scenes/**'
      - 'assets/**'
      - '.github/workflows/android-debug-apk.yml'

permissions:
  contents: write

# Only one preview build may publish the moving android-preview release.
concurrency:
  group: titan-legends-android-preview
  cancel-in-progress: true

jobs:
  export-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the game
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          echo "Using Android SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platform-tools" "build-tools;35.0.1" "platforms;android-35"
          test -x "$ANDROID_HOME/platform-tools/adb"

      - name: Install Godot 4.6 stable
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.6-stable_linux.x86_64
          sudo mv /tmp/Godot_v4.6-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Install Android export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.stable"
          curl --fail --location --retry 3 --output /tmp/godot_templates.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz"
          unzip -j -q /tmp/godot_templates.tpz \
            'templates/android_debug.apk' 'templates/android_release.apk' \
            -d "$HOME/.local/share/godot/export_templates/4.6.stable"
          test -s "$HOME/.local/share/godot/export_templates/4.6.stable/android_debug.apk"
          rm -f /tmp/godot_templates.tpz

      - name: Configure Android export paths and debug key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          cat > "$HOME/.config/godot/editor_settings-4.6.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          keytool -genkeypair -noprompt -keyalg RSA -keysize 2048 \
            -alias androiddebugkey -keypass android \
            -keystore "$HOME/.android/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 10000
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Import game resources
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --import --quit

      - name: Export Android arm64 debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/TitanLegends-debug.apk
          test -s build/TitanLegends-debug.apk
          unzip -tq build/TitanLegends-debug.apk | tail -1
          unzip -l build/TitanLegends-debug.apk | grep -q 'AndroidManifest.xml'

      - name: Publish APK as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: TitanLegends-Android-Debug
          path: build/TitanLegends-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish direct APK download on GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="android-preview"
          apk="build/TitanLegends-debug.apk"
          description="Development preview only. Godot 4.6 arm64 debug build; not a production release. Android device testing is still required. Each CI build uses a temporary debug signature, so replacing an older installed preview may require uninstalling it first."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
            gh release edit "$tag" --target "$GITHUB_SHA" --title "Titan Legends Android Preview" --notes "$description" --prerelease
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" --title "Titan Legends Android Preview" --notes "$description" --prerelease
          fi
