name: UnityFS metadata inspector tests

on:
  push:
    paths:
      - 'tools/inspect_unityfs.py'
      - 'tests/test_unityfs_inspector.py'
      - '.github/workflows/unityfs-inspector-tests.yml'
  pull_request:
    paths:
      - 'tools/inspect_unityfs.py'
      - 'tests/test_unityfs_inspector.py'
      - '.github/workflows/unityfs-inspector-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser dependency
        run: python -m pip install 'lz4>=4,<5'
      - name: Run synthetic metadata tests
        run: python -m unittest discover -s tests -p 'test_unityfs_inspector.py' -v
