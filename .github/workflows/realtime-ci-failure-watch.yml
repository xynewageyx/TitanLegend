name: Real-time CI failure watch

on:
  workflow_run:
    workflows:
      - "Titan Legends Core Regression"
      - "Godot Project Validation"
      - "Android Export"
      - "Generate Chibi Hero GLBs"
      - "Chat moderation validation"
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run ID to inspect"
        required: true
        type: string

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  report-failure:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Open or update actionable CI failure issue
        uses: actions/github-script@v7
        env:
          RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || github.event.workflow_run.id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const runId = Number(process.env.RUN_ID);
            if (!Number.isSafeInteger(runId) || runId <= 0) {
              core.setFailed('Invalid workflow run ID');
              return;
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId });
            if (run.conclusion !== 'failure') {
              core.info('Workflow is not failed; no issue needed.');
              return;
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: runId, per_page: 100
            });
            const failures = jobs.filter(job => job.conclusion === 'failure');
            const details = failures.map(job => {
              const steps = (job.steps || []).filter(step => step.conclusion === 'failure');
              const lines = steps.map(step => '- Step ' + step.number + ': ' + step.name).join('\n');
              return '### ' + job.name + '\n' + (job.html_url || run.html_url) + '\n' +
                (lines || '- Failed job; inspect logs');
            }).join('\n\n');
            const title = '[CI failure] ' + run.name + ' #' + runId;
            const body = [
              'GitHub Actions detected a failed run immediately after completion.',
              '',
              '- **Run:** ' + run.html_url,
              '- **Branch:** `' + run.head_branch + '`',
              '- **Commit:** `' + run.head_sha + '`',
              '- **Event:** ' + run.event,
              '',
              details || 'No failed job details returned; inspect the run.',
              '',
              '### Repair policy',
              'This watcher reports failures but does **not** execute untrusted workflow code,',
              'push commits, change main, or auto-merge. A separate authorized repair',
              'agent is required for automatic code changes.'
            ].join('\n');
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', per_page: 100, creator: 'github-actions[bot]'
            });
            const issue = existing.find(item => !item.pull_request && item.title === title);
            if (issue) {
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, body });
              core.info('Updated issue #' + issue.number);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body });
              core.info('Created issue #' + created.data.number);
            }
