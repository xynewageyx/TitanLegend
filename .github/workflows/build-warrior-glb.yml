name: Build procedural warrior GLB
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/asset_pipeline/build_warrior_glb.py'
      - '.github/workflows/build-warrior-glb.yml'
      - 'tests/test_warrior_glb_import.gd'
      - 'scripts/warrior_glb_preview.gd'
      - 'scenes/warrior_glb_preview.tscn'
      - 'scripts/warrior_glb_visual.gd'
      - 'scripts/team_formation.gd'
permissions:
  contents: write
jobs:
  build-warrior:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          blender --version
          blender --background --factory-startup --python-expr "import numpy; print('Blender NumPy:', numpy.__version__)"
      - name: Generate warrior model
        run: |
          mkdir -p build/characters
          blender --background --factory-startup --python tools/asset_pipeline/build_warrior_glb.py -- build/characters/titan_warrior.glb
          test -s build/characters/titan_warrior.glb
      - name: Validate GLB header
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          import json
          p = Path("build/characters/titan_warrior.glb")
          data = p.read_bytes()
          assert data[:4] == b"glTF", "Not a GLB file"
          version, size = struct.unpack_from("<II", data, 4)
          assert version == 2 and size == len(data), "Invalid GLB header"
          chunk_size, chunk_type = struct.unpack_from("<I4s", data, 12)
          assert chunk_type == b"JSON", "First GLB chunk must contain JSON"
          payload = json.loads(data[20:20 + chunk_size])
          animations = payload.get("animations", [])
          assert len(animations) >= 6, f"Expected six animations, found {len(animations)}"
          assert payload.get("skins"), "GLB missing skinned skeleton"
          assert payload.get("meshes"), "GLB missing character meshes"
          print("Animations:", [a.get("name") for a in animations])
          print("Validated", p, len(data), "bytes")
          PY
      - name: Install generated GLB into project assets
        run: |
          mkdir -p assets/characters
          cp build/characters/titan_warrior.glb assets/characters/titan_warrior.glb
      - name: Upload Android-downloadable GLB
        uses: actions/upload-artifact@v4
        with:
          name: TitanLegends-Warrior-GLB
          path: build/characters/titan_warrior.glb
          if-no-files-found: error
          retention-days: 14
      - name: Install Godot 4.7.2 stable for GLB integration test
        run: |
          curl --fail --location --retry 3 --output /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          sudo mv /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
          godot --version | grep -F '4.7.2'
      - name: Import GLB and parse preview in Godot
        run: |
          mkdir -p assets/characters
          cp build/characters/titan_warrior.glb assets/characters/titan_warrior.glb
          godot --headless --path . --editor --import --quit
          godot --headless --path . --script res://tests/test_warrior_glb_import.gd
          godot --headless --path . --quit-after 10 res://scenes/warrior_glb_preview.tscn
      - name: Commit generated GLB to main for Android Godot
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/characters/titan_warrior.glb
          if git diff --cached --quiet; then
            echo "Warrior GLB unchanged"
          else
            git commit -m "assets: update generated animated warrior GLB"
            git push origin HEAD:main
          fi
