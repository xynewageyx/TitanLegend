name: Unity TypeTree inspector tests

on:
  push:
    paths:
      - "tools/inspect_unity_objects.py"
      - "tools/inspect_unity_typetree.py"
      - "tests/test_unity_typetree_inspector.py"
      - "tools/check_bone_path_hashes.py"
      - "tests/test_bone_path_hashes.py"
      - "tools/verify_bone_hierarchy_hashes.py"
      - "tests/test_verify_bone_hierarchy_hashes.py"
      - "tools/audit_unity_transform_hierarchies.py"
      - "tests/test_unity_transform_hierarchy_audit.py"
      - "tools/audit_unity_external_dependencies.py"
      - "tests/test_unity_external_dependencies.py"
      - ".github/workflows/unity-typetree-tests.yml"
  pull_request:
    paths:
      - "tools/inspect_unity_objects.py"
      - "tools/inspect_unity_typetree.py"
      - "tests/test_unity_typetree_inspector.py"
      - "tools/check_bone_path_hashes.py"
      - "tests/test_bone_path_hashes.py"
      - "tools/verify_bone_hierarchy_hashes.py"
      - "tests/test_verify_bone_hierarchy_hashes.py"
      - "tools/audit_unity_transform_hierarchies.py"
      - "tests/test_unity_transform_hierarchy_audit.py"
      - "tools/audit_unity_external_dependencies.py"
      - "tests/test_unity_external_dependencies.py"
      - ".github/workflows/unity-typetree-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all Unity analysis tools and tests
        run: python -m compileall -q tools tests
      - name: Run hierarchy-to-mesh hash validation tests
        run: python -m unittest discover -s tests -p 'test_verify_bone_hierarchy_hashes.py' -v
      - name: Run transform hierarchy integrity tests
        run: python -m unittest discover -s tests -p 'test_unity_transform_hierarchy_audit.py' -v
      - name: Run external dependency audit tests
        run: python -m unittest discover -s tests -p 'test_unity_external_dependencies.py' -v
      - name: Run synthetic bone path hash tests
        run: python -m unittest discover -s tests -p 'test_bone_path_hashes.py' -v
      - name: Run synthetic TypeTree tests
        run: python -m unittest discover -s tests -p 'test_unity_typetree_inspector.py' -v
