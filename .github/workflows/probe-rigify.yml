name: Probe Rigify isolated
on:
  workflow_dispatch:
jobs:
  rigify-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
      - name: Check Rigify in headless Blender
        run: blender --background --factory-startup --python tools/asset_pipeline/probe_rigify.py
