name: Probe Rigify isolated
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/asset_pipeline/probe_rigify.py'
      - '.github/workflows/probe-rigify.yml'
jobs:
  rigify-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
      - name: Install glTF exporter Python dependencies
        run: |
          sudo apt-get install -y python3-numpy
          blender --background --factory-startup --python-expr 'import numpy; print("NUMPY:", numpy.__version__)'
      - name: Check Blender version
        run: blender --background --factory-startup --python-expr 'import bpy; print("BLENDER:", bpy.app.version_string)'
      - name: Generate a real Rigify rig in headless Blender
        run: blender --background --factory-startup --python tools/asset_pipeline/probe_rigify.py
      - name: Upload isolated Rigify rig for inspection
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TitanLegends-Rigify-Probe
          path: build/rigify_probe.glb
          if-no-files-found: error
