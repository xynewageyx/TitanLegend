name: Asset toolchain checks
on:
  push:
    paths:
      - 'tools/asset_pipeline/**'
      - '.github/workflows/asset-toolchain.yml'
  pull_request:
    paths:
      - 'tools/asset_pipeline/**'
      - '.github/workflows/asset-toolchain.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate scripts
        run: python3 -m compileall -q tools/asset_pipeline
      - name: Generate and validate manifests
        run: |
          python3 tools/asset_pipeline/character_creator.py
          python3 tools/asset_pipeline/landscape_generator.py
          python3 tools/asset_pipeline/animation_system.py
          python3 tools/asset_pipeline/asset_manager.py
          python3 tools/asset_pipeline/godot_importer.py
      - name: Check specification counts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('tools/asset_pipeline/generated')
          assert len(json.loads((root/'heroes.json').read_text())['heroes']) == 10
          assert len(json.loads((root/'biomes.json').read_text())['biomes']) == 12
          assert len(json.loads((root/'animations.json').read_text())['clips']) == 6
          PY
