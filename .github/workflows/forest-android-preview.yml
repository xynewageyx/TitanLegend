name: Forest Preview Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - feature/blender-grasland-pipeline
    paths:
      - ".github/workflows/forest-android-preview.yml"
      - "scenes/grasland_preview.tscn"
      - "scenes/grasland_performance_hud.gd"
jobs:
  android-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy xvfb libgl1-mesa-dri mesa-vulkan-drivers libvulkan1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build dependencies
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Generate isolated forest preview
        run: |
          set -euo pipefail
          blender -b --python tools/blender/generate_grasland.py
          python3 tools/blender/validate_grasland_glb.py /tmp/grasland.glb /tmp/grasland-performance.json
          mkdir -p preview/assets/worlds/grasland preview/scenes build
          cp /tmp/grasland.glb preview/assets/worlds/grasland/grasland.glb
          cp scenes/grasland_preview.tscn scenes/grasland_performance_hud.gd scenes/grasland_orbit_camera.gd preview/scenes/
          cat > preview/project.godot <<'EOF'
          config_version=5
          [application]
          config/name="Titan Legends Forest FPS Test"
          run/main_scene="res://scenes/grasland_preview.tscn"
          config/features=PackedStringArray("4.7", "GL Compatibility")
          [display]
          window/size/viewport_width=720
          window/size/viewport_height=1280
          window/handheld/orientation=1
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
          cp export_presets.cfg preview/export_presets.cfg
      - name: Install Godot 4.7.2 and Android export templates
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -fL --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          mkdir -p /tmp/godot-bin /tmp/godot-templates "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          chmod +x /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Export debug APK
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GODOT_AUDIO_DRIVER: Dummy
        run: |
          set -euo pipefail
          GODOT=/tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -d "$SDK_PATH/platform-tools"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK_PATH"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          if [ -f /usr/share/vulkan/icd.d/lvp_icd.x86_64.json ]; then
            export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          fi
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          cat >> preview/export_presets.cfg <<EOF
          keystore/debug="$HOME/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          EOF
          xvfb-run -a "$GODOT" --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --path preview --editor --import --quit 2>&1 | tee /tmp/forest-android-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|(^|[[:space:]])ERROR:|Failed to load script" /tmp/forest-android-import.log; then
            echo "::error::Forest preview import contains Godot errors"
            exit 1
          fi
          xvfb-run -a "$GODOT" --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --path preview --export-debug "Android" "$GITHUB_WORKSPACE/build/TitanLegends-Forest-FPS-Test.apk" 2>&1 | tee /tmp/forest-android-export.log
          if grep -E "SCRIPT ERROR:|Parse Error:|(^|[[:space:]])ERROR:|Failed to load script|Export failed" /tmp/forest-android-export.log; then
            echo "::error::Forest Android export reported errors"
            exit 1
          fi
          test -s build/TitanLegends-Forest-FPS-Test.apk
          unzip -t build/TitanLegends-Forest-FPS-Test.apk | tail -n 2
          sha256sum build/TitanLegends-Forest-FPS-Test.apk
      - name: Upload Godot diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TitanLegends-Forest-Android-Diagnostics
          path: |
            /tmp/forest-android-import.log
            /tmp/forest-android-export.log
          if-no-files-found: ignore
      - name: Upload Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: TitanLegends-Forest-FPS-Test-Android
          path: build/TitanLegends-Forest-FPS-Test.apk
          if-no-files-found: error
      - name: Upload geometry report
        uses: actions/upload-artifact@v4
        with:
          name: TitanLegends-Forest-FPS-Geometry
          path: /tmp/grasland-performance.json
          if-no-files-found: error
